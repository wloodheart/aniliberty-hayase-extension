name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - rollback
      version:
        description: Package version to validate without publishing
        required: true
        type: string
      target_version:
        description: Existing version to restore on Pages
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.operation == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_DRY_RUN_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.coordinates.outputs.version }}
      tag: ${{ steps.coordinates.outputs.tag }}
      repository: ${{ steps.coordinates.outputs.repository }}
      sha256: ${{ steps.prepare.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Validate release coordinates
        id: coordinates
        run: bun run release:workflow validate
      - name: Run deterministic quality gates
        run: bun run check
      - name: Build production bundle
        run: bun run build
      - name: Verify production bundle
        run: bun run verify:bundle
      - name: Restore immutable release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:workflow restore
      - name: Build and inspect atomic release site
        id: prepare
        run: bun run release:workflow prepare
      - name: Upload immutable Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .release-site
          retention-days: 1
      - name: Upload exact release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-payload
          path: release-payload
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  rollback-build:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ROLLBACK_TARGET_VERSION: ${{ inputs.target_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic rollback quality gates
        run: bun run check:rollback
      - name: Reconstruct and verify rollback Pages tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:workflow rollback-prepare
      - name: Upload verified rollback Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .release-site
          retention-days: 1

  rollback-deploy:
    needs: rollback-build
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified rollback Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  attest:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-payload
          path: release-payload
      - name: Verify bundle checksum
        run: cd release-payload && sha256sum --check aniliberty.mjs.sha256
      - name: Attest exact published bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-payload/aniliberty.mjs

  release:
    needs:
      - build
      - attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Download exact release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-payload
          path: release-payload
      - name: Verify downloaded release payload
        run: bun run release:workflow verify-payload
      - name: Publish complete immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REPOSITORY: ${{ needs.build.outputs.repository }}
        run: gh release create "$RELEASE_TAG" release-payload/aniliberty.mjs release-payload/aniliberty.mjs.sha256 release-payload/provenance.json --repo "$RELEASE_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes

  deploy:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
