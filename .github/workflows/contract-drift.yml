name: Contract drift

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Prepare drift evidence
        run: mkdir -p drift-evidence
      - name: Compare current Hayase contract
        id: hayase
        continue-on-error: true
        run: bun run contract:hayase 2> drift-evidence/hayase.json
      - name: Compare current AniLiberty contract
        id: aniliberty
        continue-on-error: true
        run: bun run contract:aniliberty 2> drift-evidence/aniliberty.json
      - name: Classify live AniLiberty health
        id: smoke
        continue-on-error: true
        run: bun run live:smoke 2> drift-evidence/live-smoke.txt
      - name: Upload confirmed drift evidence
        if: steps.hayase.outcome == 'failure' || steps.aniliberty.outcome == 'failure' || steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-drift
          path: drift-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Fail on confirmed drift
        if: steps.hayase.outcome == 'failure' || steps.aniliberty.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: exit 1
