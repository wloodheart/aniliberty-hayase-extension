name: Contract drift

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Prepare drift evidence
        run: mkdir -p drift-evidence
      - name: Compare current Hayase contract
        id: hayase
        continue-on-error: true
        run: bun run contract:hayase 2> drift-evidence/hayase.json
      - name: Compare current AniLiberty contract
        id: aniliberty
        continue-on-error: true
        run: bun run contract:aniliberty 2> drift-evidence/aniliberty.json
      - name: Classify live AniLiberty health
        id: smoke
        continue-on-error: true
        run: bun run live:smoke 2> drift-evidence/live-smoke.txt
      - name: Upload confirmed drift evidence
        if: steps.hayase.outcome == 'failure' || steps.aniliberty.outcome == 'failure' || steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-drift
          path: drift-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Fail on confirmed drift
        if: steps.hayase.outcome == 'failure' || steps.aniliberty.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: exit 1
