name: Missing version comment
on: pull_request
permissions:
  contents: read
concurrency:
  group: fixture-missing-version-comment
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
